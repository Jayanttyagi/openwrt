name: Automatically sync JIDU6J11 OpenWrt fork with official OpenWrt

on:
  workflow_dispatch:
    inputs:
      fork_branch:
        description: "Your fork branch containing JIDU6J11 support"
        required: true
        default: "main"

      upstream_repository:
        description: "Official OpenWrt repository"
        required: true
        default: "https://github.com/openwrt/openwrt.git"

      upstream_ref:
        description: "Official OpenWrt branch or tag to merge"
        required: true
        default: "main"

      jidu_variant:
        description: "JIDU6J11 hardware variant to verify"
        required: true
        default: "6411"
        type: choice
        options:
          - "6111"
          - "6411"
          - "6611"
          - "6811"
          - "6911"

      create_pull_request:
        description: "Create a pull request after a successful automatic merge"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-openwrt-upstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-upstream:
    name: Merge official OpenWrt and preserve JIDU6J11 support
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      FORK_BRANCH: ${{ inputs.fork_branch }}
      UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository }}
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
      JIDU_VARIANT: ${{ inputs.jidu_variant }}
      DEVICE_ID: jiorouter_ax6000-jidu6j11-${{ inputs.jidu_variant }}

      UBOOT_ENV_FILE: package/boot/uboot-tools/uboot-envtools/files/qualcommbe_ipq95xx
      PLATFORM_SH_FILE: target/linux/qualcommbe/ipq95xx/base-files/lib/upgrade/platform.sh

    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail

          if [ -z "$FORK_BRANCH" ]; then
            echo "::error::Fork branch is required."
            exit 1
          fi

          if [ -z "$UPSTREAM_REPOSITORY" ] || [ -z "$UPSTREAM_REF" ]; then
            echo "::error::Upstream repository and ref are required."
            exit 1
          fi

      - name: Checkout fork with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.fork_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add official OpenWrt upstream
        run: |
          set -euo pipefail

          git remote add upstream "$UPSTREAM_REPOSITORY" || true
          git remote set-url upstream "$UPSTREAM_REPOSITORY"
          git fetch upstream "$UPSTREAM_REF" --no-tags

          git remote -v

      - name: Create upstream-sync branch
        run: |
          set -euo pipefail

          sync_branch="jidu6j11-upstream-sync-$(date +%Y%m%d-%H%M%S)"
          echo "SYNC_BRANCH=$sync_branch" >> "$GITHUB_ENV"

          git checkout -b "$sync_branch"

      - name: Attempt upstream merge
        id: merge
        run: |
          set -uo pipefail

          merge_ok=true

          if ! git merge --no-commit --no-ff \
            "upstream/$UPSTREAM_REF"; then
            merge_ok=false
          fi

          if [ "$merge_ok" = "true" ] && [ -n "$(git ls-files -u)" ]; then
            merge_ok=false
          fi

          if [ "$merge_ok" = "false" ]; then
            echo "MERGE_CONFLICT=true" >> "$GITHUB_ENV"

            echo "::notice::Upstream merge produced conflicts. Applying known JIDU6J11-safe resolutions."
          else
            echo "MERGE_CONFLICT=false" >> "$GITHUB_ENV"
          fi

      - name: Automatically resolve known conflicts
        if: env.MERGE_CONFLICT == 'true'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          python3 <<'PYEOF'
          import os
          import subprocess
          import sys
          from pathlib import Path

          def git(*args, text=True):
              return subprocess.check_output(
                  ["git", *args],
                  text=text,
              )

          def stage(path):
              git("add", "--", path)

          def take_upstream(path):
              git("checkout", "--theirs", "--", path)
              stage(path)
              print(f"Resolved using official OpenWrt upstream: {path}")

          def accept_upstream_deletion(path):
              git("rm", "-f", "--", path)
              print(f"Accepted official OpenWrt deletion: {path}")

          def ours_text(path):
              return git("show", f":2:{path}")

          def theirs_text(path):
              return git("show", f":3:{path}")

          def write_and_stage(path, content):
              Path(path).write_text(content, encoding="utf-8", newline="\n")
              stage(path)
              print(f"Resolved by preserving JIDU6J11 changes: {path}")

          def normalize(text):
              return text.replace("\r\n", "\n").replace("\r", "\n")

          def find_function_lines(lines, function_name):
              start = None
              depth = 0

              for index, line in enumerate(lines):
                  stripped = line.strip()

                  if start is None:
                      if stripped.startswith(f"{function_name}(") and stripped.endswith("{"):
                          start = index
                          depth = line.count("{") - line.count("}")
                          continue

                  if start is not None:
                      depth += line.count("{") - line.count("}")

                      if depth <= 0:
                          return start, index

              raise ValueError(
                  f"Could not find shell function: {function_name}"
              )

          def find_case_lines(lines, marker):
              start = None
              depth = 0

              for index, line in enumerate(lines):
                  stripped = line.strip()

                  if start is None:
                      if marker in line:
                          start = index
                          depth = line.count("{") - line.count("}")
                          continue

                  if start is not None:
                      depth += line.count("{") - line.count("}")

                      if depth <= 0 and stripped == ";;":
                          return start, index

              raise ValueError(
                  f"Could not find case block containing: {marker}"
              )

          def join_lines(lines, start, end):
              return "\n".join(lines[start:end + 1]) + "\n"

          def insert_before_function(lines, function_name, insertion_lines):
              for index, line in enumerate(lines):
                  if line.strip().startswith(f"{function_name}("):
                      lines[index:index] = insertion_lines
                      return

              raise ValueError(
                  f"Could not find function: {function_name}"
              )

          def insert_into_first_case(lines, function_name, insertion_lines):
              for index, line in enumerate(lines):
                  if line.strip().startswith(f"{function_name}("):
                      for case_index in range(index, len(lines)):
                          if lines[case_index].strip().startswith('case "$(board_name)" in'):
                              insertion_index = case_index + 1
                              lines[insertion_index:insertion_index] = insertion_lines
                              return

                      raise ValueError(
                          f"Could not find case statement in {function_name}()"
                      )

              raise ValueError(
                  f"Could not find function: {function_name}"
              )

          upstream_files = [
              "package/firmware/ath11k-firmware/Makefile",
              "package/kernel/mac80211/Makefile",
              "target/linux/generic/pending-6.18/706-net-phy-populate-host_interfaces-when-attaching-PHY.patch",
              "target/linux/generic/pending-6.18/737-01-net-phylink-keep-and-use-MAC-supported_interfaces-in.patch",
              "target/linux/generic/pending-6.18/737-02-net-phylink-introduce-internal-phylink-PCS-handling.patch",
              "target/linux/generic/pending-6.18/737-07-net-phylink-add-.pcs_link_down-PCS-OP.patch",
          ]

          upstream_deleted_files = [
              "target/linux/generic/pending-6.18/737-03-net-phylink-add-phylink_release_pcs-to-externally-re.patch",
              "target/linux/generic/pending-6.18/737-05-net-phylink-support-late-PCS-provider-attach.patch",
          ]

          for path in upstream_files:
              take_upstream(path)

          for path in upstream_deleted_files:
              accept_upstream_deletion(path)

          marker = "jiorouter,ax6000-jidu6j11-6111"

          # Resolve U-Boot environment configuration:
          # retain official upstream boards and restore JIDU6J11 cases.
          uboot_env = os.environ["UBOOT_ENV_FILE"]
          theirs = normalize(theirs_text(uboot_env)).splitlines()
          ours = normalize(ours_text(uboot_env)).splitlines()

          try:
              jidu_start, jidu_end = find_case_lines(ours, marker)
          except ValueError as exc:
              print("::error::" + str(exc))
              print("::group::Fork U-Boot environment file")
              print("\n".join(ours))
              print("::endgroup::")
              sys.exit(1)

          jidu_block = join_lines(ours, jidu_start, jidu_end)

          if marker not in "\n".join(theirs):
              inserted = False

              for index in range(len(theirs) - 1, -1, -1):
                  if theirs[index].strip() == "esac":
                      theirs[index:index] = (
                          jidu_block.rstrip("\n").splitlines()
                          + ["", "esac"]
                      )
                      inserted = True
                      break

              if not inserted:
                  raise ValueError(
                      "Could not find final esac in U-Boot environment file"
                  )

          write_and_stage(uboot_env, "\n".join(theirs) + "\n")

          # Resolve platform.sh:
          # use official upstream as the base, then restore the JIDU6J11
          # initial U-Boot setup, upgrade case, and platform image check.
          platform_sh = os.environ["PLATFORM_SH_FILE"]
          theirs = normalize(theirs_text(platform_sh)).splitlines()
          ours = normalize(ours_text(platform_sh)).splitlines()

          try:
              setup_start, setup_end = find_function_lines(
                  ours,
                  "jiorouter_initial_setup",
              )
          except ValueError as exc:
              print("::error::" + str(exc))
              print("::group::Fork platform.sh content")
              print("\n".join(ours))
              print("::endgroup::")
              sys.exit(1)

          jidu_initial_setup = join_lines(ours, setup_start, setup_end)

          try:
              upgrade_start, upgrade_end = find_case_lines(ours, marker)
          except ValueError as exc:
              print("::error::" + str(exc))
              print("::group::Fork platform.sh content")
              print("\n".join(ours))
              print("::endgroup::")
              sys.exit(1)

          jidu_upgrade_case = join_lines(ours, upgrade_start, upgrade_end)

          try:
              check_start, check_end = find_case_lines(ours, marker)
          except ValueError as exc:
              print("::error::" + str(exc))
              print("::group::Fork platform.sh content")
              print("\n".join(ours))
              print("::endgroup::")
              sys.exit(1)

          jidu_check_case = join_lines(ours, check_start, check_end)

          # Remove any existing JIDU initial-setup function from upstream base.
          try:
              existing_start, existing_end = find_function_lines(
                  theirs,
                  "jiorouter_initial_setup",
              )
              del theirs[existing_start:existing_end + 1]
          except ValueError:
              pass

          # Insert the JIDU initial-setup function before platform_check_image().
          if "jiorouter_initial_setup(" not in "\n".join(theirs):
              insert_before_function(
                  theirs,
                  "platform_check_image",
                  jidu_initial_setup.rstrip("\n").splitlines() + ["", ""],
              )

          # Insert the JIDU upgrade case into platform_do_upgrade().
          if marker not in "\n".join(theirs):
              insert_into_first_case(
                  theirs,
                  "platform_do_upgrade",
                  jidu_upgrade_case.rstrip("\n").splitlines(),
              )

          # Insert the JIDU check case into platform_check_image().
          if marker not in "\n".join(theirs):
              insert_into_first_case(
                  theirs,
                  "platform_check_image",
                  jidu_check_case.rstrip("\n").splitlines(),
              )

          write_and_stage(platform_sh, "\n".join(theirs) + "\n")

          # Ensure no unexpected conflicts remain.
          unmerged = git("diff", "--name-only", "--diff-filter=U").strip()

          if unmerged:
              print("::error::The following conflicts require manual resolution:")
              print(unmerged)
              sys.exit(1)
          PYEOF

      - name: Verify no conflict markers or unmerged files
        run: |
          set -euo pipefail

          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::Unmerged files remain:"
            git ls-files -u
            exit 1
          fi

          # Match only real Git conflict markers:
          #   <<<<<<< HEAD
          #   =======
          #   >>>>>>> upstream/main
          #
          # Do not match OpenWrt's failsafe banner, which contains long
          # "=====" separator lines.
          if grep -RInE '^(<{7} .*|={7}[[:space:]]*$|>{7} )' \
            package \
            target \
            include; then
            echo "::error::Conflict markers remain in the source tree."
            exit 1
          fi

      - name: Verify JIDU6J11 device support survived
        run: |
          set -euo pipefail

          if ! grep -Rqs "$DEVICE_ID" target/linux/qualcommbe; then
            echo "::error::JIDU6J11 device $DEVICE_ID is missing after merge."
            exit 1
          fi

          grep -Rni "$DEVICE_ID" target/linux/qualcommbe

      - name: Verify JIDU U-Boot and upgrade support survived
        run: |
          set -euo pipefail

          grep -q "jiorouter,ax6000-jidu6j11-$JIDU_VARIANT" \
            "$UBOOT_ENV_FILE"

          grep -q "jiorouter_initial_setup" "$PLATFORM_SH_FILE"
          grep -q "jiorouter,ax6000-jidu6j11-$JIDU_VARIANT" \
            "$PLATFORM_SH_FILE"
          grep -q "jiorouter_initial_setup || return 1" \
            "$PLATFORM_SH_FILE"

      - name: Verify replaced phylink patches are present
        run: |
          set -euo pipefail

          if ! grep -RqsE 'phylink_release_pcs|late-PCS-provider|pcs_link_down' \
            target/linux/generic; then
            echo "::warning::No replacement phylink patch content was found after accepting upstream deletions."
            echo "::warning::Review target/linux/generic/pending-6.18/ before merging this sync branch."
          fi

      - name: Commit automatic merge resolution
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Merge official OpenWrt $UPSTREAM_REF into JIDU6J11 fork

          Automatically resolved known conflicts:
          - Took official OpenWrt for generic kernel, mac80211 and ath11k firmware files
          - Accepted official OpenWrt deletions of obsolete phylink patches
          - Preserved JIDU6J11 U-Boot environment configuration
          - Preserved JIDU6J11 initial U-Boot setup, upgrade handling and platform image checks"
          fi

      - name: Push upstream-sync branch
        run: |
          set -euo pipefail

          git push origin "$SYNC_BRANCH"

      - name: Create pull request
        if: inputs.create_pull_request == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          title="Sync JIDU6J11 with official OpenWrt $UPSTREAM_REF"

          body=$(cat <<EOF
          Automated merge of official OpenWrt \`$UPSTREAM_REF\` into \`$FORK_BRANCH\`.

          **Target device:** \`$DEVICE_ID\`

          ### Automatic conflict policy

          - Official OpenWrt was preferred for generic kernel patches, \`mac80211\`, and \`ath11k-firmware\`.
          - Official OpenWrt deletions of obsolete phylink patches were accepted.
          - JIDU6J11 U-Boot environment entries were preserved.
          - JIDU6J11 initial U-Boot setup, NAND/UBI upgrade handling, and platform image checks were preserved.
          - Official OpenWrt platform-upgrade improvements were retained.

          ### Required review before merging

          - Review \`target/linux/qualcommbe/\` and QCA-related changes.
          - Run the JIDU6J11 firmware build workflow against this branch.
          - Test the resulting \`*-initramfs-factory.ubi\` before flashing a permanent sysupgrade image.
          EOF
          )

          gh pr create \
            --base "$FORK_BRANCH" \
            --head "$SYNC_BRANCH" \
            --title "$title" \
            --body "$body"

      - name: Upload unresolved conflict report
        if: failure()
        run: |
          set -euo pipefail

          mkdir -p conflict-report

          git status > conflict-report/git-status.txt || true
          git diff --name-only --diff-filter=U \
            > conflict-report/conflicted-files.txt || true
          git diff > conflict-report/conflict-diff.patch || true

      - name: Upload conflict artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-merge-conflicts-${{ github.run_number }}
          path: conflict-report/
          if-no-files-found: ignore
          retention-days: 14
